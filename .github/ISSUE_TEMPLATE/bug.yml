name: Bug
description: Algo no funciona como dice la spec
title: "fix: <resumen>"
labels: [bug]
body:
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Esperado vs. obtenido
    validations:
      required: true
  - type: input
    id: spec
    attributes:
      label: Spec relacionada
      placeholder: docs/features/<feature>/spec.md
