name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Validar JSON Schema del grafo
        run: npx --yes ajv-cli@5 compile --spec=draft2020 -s packages/schema/walkie-graph.schema.json

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sin proyecto API todavía
        if: ${{ hashFiles('apps/api/**/*.csproj') == '' }}
        run: echo "apps/api aún no tiene proyectos; se omite."
      - uses: actions/setup-dotnet@v4
        if: ${{ hashFiles('apps/api/**/*.csproj') != '' }}
        with:
          global-json-file: global.json
      - if: ${{ hashFiles('apps/api/**/*.csproj') != '' }}
        run: dotnet restore apps/api
      - if: ${{ hashFiles('apps/api/**/*.csproj') != '' }}
        run: dotnet build apps/api --no-restore -c Release
      - if: ${{ hashFiles('apps/api/**/*.csproj') != '' }}
        run: dotnet test apps/api --no-build -c Release

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sin proyecto web todavía
        if: ${{ hashFiles('apps/web/package.json') == '' }}
        run: echo "apps/web aún no tiene package.json; se omite."
      - uses: pnpm/action-setup@v4
        if: ${{ hashFiles('apps/web/package.json') != '' }}
        with:
          # Usa la versión de "packageManager" de apps/web (no hay package.json en la raíz).
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        if: ${{ hashFiles('apps/web/package.json') != '' }}
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - if: ${{ hashFiles('apps/web/package.json') != '' }}
        run: pnpm --dir apps/web install --frozen-lockfile
      - if: ${{ hashFiles('apps/web/package.json') != '' }}
        run: pnpm --dir apps/web check:schema
      - if: ${{ hashFiles('apps/web/package.json') != '' }}
        run: pnpm --dir apps/web lint
      - if: ${{ hashFiles('apps/web/package.json') != '' }}
        run: pnpm --dir apps/web test
      - if: ${{ hashFiles('apps/web/package.json') != '' }}
        run: pnpm --dir apps/web build

  # Gate de la fase 1: flujo completo con API, Keycloak y Postgres reales (apps/web/e2e).
  e2e:
    runs-on: ubuntu-latest
    needs: [api, web]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Levantar Postgres y Keycloak
        run: |
          docker compose -f infra/docker-compose.yml up -d --wait postgres
          docker compose -f infra/docker-compose.yml up -d keycloak
          for i in $(seq 1 90); do curl -sf http://localhost:8080/realms/walkie >/dev/null && exit 0; sleep 2; done
          docker compose -f infra/docker-compose.yml logs keycloak | tail -50
          exit 1
      - run: pnpm --dir apps/web install --frozen-lockfile
      - run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - run: dotnet build apps/api/src/Walkie.Api
      - name: E2E (Playwright levanta la API y la web)
        run: pnpm --dir apps/web e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
