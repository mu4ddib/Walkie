name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Validar los JSON Schema
        # ajv-formats: sin él, ajv en modo estricto rechaza `format: uuid`.
        # -r con los demás schemas: walkie-shared-feature usa `$ref` a walkie-graph y walkie-catalog-item.
        run: |
          for schema in packages/schema/*.schema.json; do
            refs=()
            for other in packages/schema/*.schema.json; do
              if [ "$other" != "$schema" ]; then refs+=(-r "$other"); fi
            done
            npx --yes -p ajv-cli@5 -p ajv-formats@3 ajv compile --spec=draft2020 -c ajv-formats -s "$schema" "${refs[@]}"
          done
      - name: Validar el catálogo de operaciones
        # Datos compartidos por la web y la API (spec interacciones, ADR-0011).
        run: npx --yes -p ajv-cli@5 -p ajv-formats@3 ajv validate --spec=draft2020 -c ajv-formats -s packages/schema/walkie-operations.schema.json -d packages/schema/walkie-operations.json
      - name: Validar los ejemplos de Walkie Live
        # Spec walkie-live (ADR-0013 y ADR-0014): cada ejemplo cumple su schema; la integridad la prueban las pruebas de la API.
        run: |
          check() {
            local schema="packages/schema/$1" data="$2" refs=()
            for other in packages/schema/*.schema.json; do
              if [ "$other" != "$schema" ]; then refs+=(-r "$other"); fi
            done
            npx --yes -p ajv-cli@5 -p ajv-formats@3 ajv validate --spec=draft2020 -c ajv-formats -s "$schema" "${refs[@]}" -d "$data"
          }
          for pack in packages/schema/examples/walkiepack/*/; do
            check walkie-discovery-pack.schema.json "${pack}manifest.json"
            check walkie-discovery.schema.json "${pack}discovery.json"
          done
          api=packages/schema/examples/discovery-api
          check walkie-discovery-snapshot.schema.json "$api/snapshot.json"
          check walkie-discovery-binding.schema.json "$api/binding-linked.json"
          check walkie-discovery-binding.schema.json "$api/binding-rejected.json"
          check walkie-discovery-review.schema.json "$api/review.json"
          check walkie-discovery-apply.schema.json "$api/apply.json"
          check walkie-discovery-apply-result.schema.json "$api/apply-result.json"
          check walkie-discovery-upload.schema.json "$api/upload-created.json"
          check walkie-discovery-upload.schema.json "$api/upload-preview.json"
          check walkie-discovery-review.schema.json "$api/review-ambiguous.json"
          check walkie-discovery-sources.schema.json "$api/sources.json"

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sin proyecto API todavía
        if: ${{ hashFiles('apps/api/**/*.csproj') == '' }}
        run: echo "apps/api aún no tiene proyectos; se omite."
      - uses: actions/setup-dotnet@v4
        if: ${{ hashFiles('apps/api/**/*.csproj') != '' }}
        with:
          global-json-file: global.json
      - if: ${{ hashFiles('apps/api/**/*.csproj') != '' }}
        run: dotnet restore apps/api
      - if: ${{ hashFiles('apps/api/**/*.csproj') != '' }}
        run: dotnet build apps/api --no-restore -c Release
      - if: ${{ hashFiles('apps/api/**/*.csproj') != '' }}
        run: dotnet test apps/api --no-build -c Release

  cli:
    # Walkie Live (spec walkie-live): analizador y CLI. Sin Docker: las pruebas usan proyectos ficticios y el propio repo.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore apps/cli/Walkie.Cli.slnx
      - run: dotnet build apps/cli/Walkie.Cli.slnx --no-restore -c Release
      - run: dotnet test apps/cli/Walkie.Cli.slnx --no-build -c Release
      - name: walkie scan sobre el propio repo
        run: dotnet run --project apps/cli/src/Walkie.Cli -c Release --no-build -- scan . -o walkie.walkiepack --source-id 0198f0c0-0000-7000-8000-0000000000a1

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sin proyecto web todavía
        if: ${{ hashFiles('apps/web/package.json') == '' }}
        run: echo "apps/web aún no tiene package.json; se omite."
      - uses: pnpm/action-setup@v4
        if: ${{ hashFiles('apps/web/package.json') != '' }}
        with:
          # Usa la versión de "packageManager" de apps/web (no hay package.json en la raíz).
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        if: ${{ hashFiles('apps/web/package.json') != '' }}
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - if: ${{ hashFiles('apps/web/package.json') != '' }}
        run: pnpm --dir apps/web install --frozen-lockfile
      - if: ${{ hashFiles('apps/web/package.json') != '' }}
        run: pnpm --dir apps/web check:schema
      - if: ${{ hashFiles('apps/web/package.json') != '' }}
        run: pnpm --dir apps/web lint
      - if: ${{ hashFiles('apps/web/package.json') != '' }}
        run: pnpm --dir apps/web test
      - if: ${{ hashFiles('apps/web/package.json') != '' }}
        run: pnpm --dir apps/web build

  # Gate de la fase 1: flujo completo con API, Keycloak y Postgres reales (apps/web/e2e).
  e2e:
    runs-on: ubuntu-latest
    needs: [api, web]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Levantar Postgres, RustFS y Keycloak
        run: |
          docker compose -f infra/docker-compose.yml up -d --wait postgres
          docker compose -f infra/docker-compose.yml up -d rustfs
          docker compose -f infra/docker-compose.yml up -d keycloak
          for i in $(seq 1 90); do curl -sf http://localhost:8080/realms/walkie >/dev/null && exit 0; sleep 2; done
          docker compose -f infra/docker-compose.yml logs keycloak | tail -50
          exit 1
      - run: pnpm --dir apps/web install --frozen-lockfile
      - run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - run: dotnet build apps/api/src/Walkie.Api
      - name: E2E (Playwright levanta la API y la web)
        run: pnpm --dir apps/web e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
