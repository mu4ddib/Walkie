name: walkie

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-walkie}
      POSTGRES_USER: ${POSTGRES_USER:-walkie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-walkie_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-walkie}"]
      interval: 5s
      retries: 10

  # Almacenamiento compatible con S3 (ADR-0004). MinIO dejó de publicar imágenes en Docker Hub.
  rustfs:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-walkie}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:-walkie_dev_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfsdata:/data

  keycloak:
    image: keycloak/keycloak:26.4
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-walkie_dev_admin}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      # Realm "walkie" de desarrollo: cliente walkie-web y usuario dev / walkie_dev.
      - ./keycloak/walkie-realm.json:/opt/keycloak/data/import/walkie-realm.json:ro

volumes:
  pgdata:
  rustfsdata:
